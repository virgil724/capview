name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet & Test
        run: |
          go vet ./...
          go test -v ./...

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o dist/capview-windows-amd64.exe ./cmd/capview
          go build -ldflags="-s -w" -o dist/capview-cli-windows-amd64.exe ./cmd/capview

      - name: Build windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o dist/capview-windows-arm64.exe ./cmd/capview
          go build -ldflags="-s -w" -o dist/capview-cli-windows-arm64.exe ./cmd/capview

      - uses: actions/upload-artifact@v4
        with:
          name: capview-windows
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
