name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & Test
        run: |
          go vet ./...
          go test -v ./...

      - name: Build linux/amd64 and linux/arm64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/capview-linux-amd64 ./cmd/capview
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/capview-linux-arm64 ./cmd/capview

      - uses: actions/upload-artifact@v4
        with:
          name: capview-linux
          path: dist/*

  vcam-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x64 COM Media Source & DirectShow DLL
        shell: pwsh
        run: |
          $ver = "1.1.0.0"
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+)\.(\d+)\.(\d+)') {
            $ver = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          }
          pwsh -File vcam/dll/build.ps1 -Arch x64 -Version $ver

      - name: Verify Placeholder, MF & DirectShow In-Proc Loopback
        shell: pwsh
        run: |
          .\vcam\dll\build\x64\vcam_loopback_test.exe `
            --dll .\vcam\dll\build\x64\capview_vcam.dll `
            --verify-placeholder `
            --frames 15
          .\vcam\dll\build\x64\vcam_loopback_test.exe `
            --dll .\vcam\dll\build\x64\capview_vcam.dll `
            --dshow-inproc `
            --frames 10

      - uses: actions/upload-artifact@v4
        with:
          name: capview-vcam-dll-x64
          path: vcam/dll/build/x64/capview_vcam.dll

  build:
    needs: [vcam-dll]
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & Test (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          go test -v ./...

      - name: Vet (windows/arm64)
        env:
          GOOS: windows
          GOARCH: arm64
        run: go vet ./...

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o dist/capview-windows-amd64.exe ./cmd/capview
          go build -ldflags="-s -w" -o dist/capview-cli-windows-amd64.exe ./cmd/capview

      - name: Build windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o dist/capview-windows-arm64.exe ./cmd/capview
          go build -ldflags="-s -w" -o dist/capview-cli-windows-arm64.exe ./cmd/capview

      - uses: actions/download-artifact@v4
        with:
          name: capview-vcam-dll-x64
          path: dist

      # ------------------------------------------------------------------
      # Optional Authenticode Signing Hooks (run BEFORE zip & checksums)
      # See docs/code-signing-options.md for setup details.
      # Hook 1: PFX / signtool.exe
      #   Requires secrets: CODESIGN_PFX_BASE64, CODESIGN_PFX_PASSWORD
      #   Optional var:     CODESIGN_TIMESTAMP_URL (default: http://timestamp.digicert.com)
      # Hook 2: SignPath Foundation (Free OSS Signing)
      #   Requires var:     SIGNPATH_ORG_ID
      #   Requires secret:  SIGNPATH_API_TOKEN
      #   Optional vars:    SIGNPATH_PROJECT_SLUG (default: capview),
      #                     SIGNPATH_SIGNING_POLICY_SLUG (default: release-signing)
      # ------------------------------------------------------------------
      - name: Sign Windows binaries (PFX / signtool.exe)
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_PASSWORD)) {
            Write-Host "Skipping PFX Authenticode signing (CODESIGN_PFX_BASE64 / CODESIGN_PFX_PASSWORD not configured)."
            exit 0
          }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits 10"
          }

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:CODESIGN_TIMESTAMP_URL)) {
            "http://timestamp.digicert.com"
          } else {
            $env:CODESIGN_TIMESTAMP_URL
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "capview-codesign.pfx"
          $targets = @(
            "dist\capview-windows-amd64.exe",
            "dist\capview-cli-windows-amd64.exe",
            "dist\capview_vcam.dll",
            "dist\capview-windows-arm64.exe",
            "dist\capview-cli-windows-arm64.exe"
          )

          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64.Trim()))
            foreach ($file in $targets) {
              Write-Host "Signing $file ..."
              & $signtool sign /fd SHA256 /f $pfxPath /p $env:CODESIGN_PFX_PASSWORD /tr $timestampUrl /td SHA256 $file
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $file with exit code $LASTEXITCODE"
              }
            }
          } finally {
            if (Test-Path $pfxPath) {
              Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
            }
          }

      - name: Clean up temporary PFX certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "capview-codesign.pfx"
          if (Test-Path $pfxPath) {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
            Write-Host "Removed temporary PFX certificate."
          }

      - name: Check SignPath Foundation signing configuration
        id: signpath_check
        shell: pwsh
        env:
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORG_ID) -or [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            Write-Host "Skipping SignPath Foundation signing (vars.SIGNPATH_ORG_ID / secrets.SIGNPATH_API_TOKEN not configured)."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          Write-Host "SignPath Foundation signing enabled for organization '$($env:SIGNPATH_ORG_ID)'."
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unsigned Windows binaries for SignPath
        id: upload_unsigned_signpath
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: capview-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            dist/capview-windows-amd64.exe
            dist/capview-cli-windows-amd64.exe
            dist/capview_vcam.dll
            dist/capview-windows-arm64.exe
            dist/capview-cli-windows-arm64.exe

      - name: Sign Windows binaries (SignPath Foundation)
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'capview' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload_unsigned_signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Apply SignPath-signed Windows binaries
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedDir = Join-Path $env:RUNNER_TEMP "signpath-signed"
          $zips = Get-ChildItem -Path $signedDir -Filter *.zip -Recurse -ErrorAction SilentlyContinue
          foreach ($z in $zips) {
            Expand-Archive -Path $z.FullName -DestinationPath $signedDir -Force
          }

          $targets = @(
            "capview-windows-amd64.exe",
            "capview-cli-windows-amd64.exe",
            "capview_vcam.dll",
            "capview-windows-arm64.exe",
            "capview-cli-windows-arm64.exe"
          )
          foreach ($name in $targets) {
            $match = Get-ChildItem -Path $signedDir -Filter $name -Recurse | Select-Object -First 1
            if (-not $match) {
              throw "SignPath output missing expected signed file: $name"
            }
            Copy-Item -Path $match.FullName -Destination (Join-Path "dist" $name) -Force
            Write-Host "Applied SignPath-signed $name"
          }

      - name: Bundle windows/amd64 zip & Windows Checksums
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "capview-amd64-bundle"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\capview-windows-amd64.exe (Join-Path $stage "capview.exe")
          Copy-Item dist\capview-cli-windows-amd64.exe (Join-Path $stage "capview-cli.exe")
          Copy-Item dist\capview_vcam.dll (Join-Path $stage "capview_vcam.dll")
          Compress-Archive -Path "$stage\*" -DestinationPath dist\capview-windows-amd64.zip -Force

          Get-ChildItem dist\* -Include *.exe,*.dll,*.zip | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: capview-windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: capview-windows
          path: release-dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: capview-linux
          path: release-dist

      - name: Generate unified SHA256SUMS.txt
        run: |
          rm -f release-dist/SHA256SUMS.txt
          (cd release-dist && LC_ALL=C sha256sum *) | sort -k2 > SHA256SUMS.txt
          mv SHA256SUMS.txt release-dist/SHA256SUMS.txt
          cat release-dist/SHA256SUMS.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-dist/*
